name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            server: FalconServer-linux-x64
          - name: macos-arm64
            os: macos-15
            server: FalconServer-macos-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zlib1g-dev ninja-build

      - name: Install build tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache PHP
        id: php
        uses: actions/cache@v4
        with:
          path: .toolchain/php
          key: php-${{ matrix.name }}-${{ hashFiles('scripts/build-php.sh') }}

      - name: Build PHP
        if: steps.php.outputs.cache-hit != 'true'
        run: scripts/build-php.sh

      - name: Build the plugin
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix dist

      - name: Download the Falcon nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly -R Falcon-MC/Falcon -p '${{ matrix.server }}' -p '${{ matrix.server }}.sha256' -D falcon
          cd falcon
          [ "$(cut -d' ' -f1 '${{ matrix.server }}.sha256')" = "$(shasum -a 256 '${{ matrix.server }}' | cut -d' ' -f1)" ]
          chmod +x '${{ matrix.server }}'

      - name: Smoke test in Falcon
        run: scripts/smoke-test.sh "$PWD/falcon/${{ matrix.server }}" dist/pmmp-compat

      - uses: actions/upload-artifact@v4
        with:
          name: pmmp-compat-${{ matrix.name }}
          path: dist/pmmp-compat

  windows:
    name: windows-x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PHP
        shell: pwsh
        run: scripts/fetch-php-windows.ps1

      - name: Build the plugin
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
          cmake --install build --config Release --prefix dist

      - name: Download the Falcon nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly -R Falcon-MC/Falcon -p 'FalconServer.exe' -p 'FalconServer.exe.sha256' -D falcon
          cd falcon
          [ "$(cut -d' ' -f1 FalconServer.exe.sha256)" = "$(sha256sum FalconServer.exe | cut -d' ' -f1)" ]
          # Falcon loads a plugin without searching its folder for the dlls it needs: the server's folder is searched
          cp ../dist/pmmp-compat/php8ts.dll .

      - name: Smoke test in Falcon
        shell: bash
        run: scripts/smoke-test.sh "$PWD/falcon/FalconServer.exe" dist/pmmp-compat

      - uses: actions/upload-artifact@v4
        with:
          name: pmmp-compat-windows-x64
          path: dist/pmmp-compat
