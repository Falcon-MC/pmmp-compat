name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FALCON_REVISION: a029f65accbd3c164bffa662342a61b791c298db

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-26
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config zlib1g-dev libcurl4-openssl-dev
          ninja-build autoconf automake libtool libsqlite3-dev libgmp-dev libssl-dev

      - name: Install build tools
        if: runner.os == 'macOS'
        run: brew install ninja autoconf automake libtool gmp openssl@3

      - name: Cache PHP
        id: php
        uses: actions/cache@v4
        with:
          path: |
            .toolchain/php
            .toolchain/deps
            .toolchain/static
          key: php-with-static-deps-${{ matrix.name }}-${{ matrix.os }}-${{ hashFiles('scripts/build-php.sh') }}

      - name: Build PHP
        if: steps.php.outputs.cache-hit != 'true'
        run: scripts/build-php.sh

      - name: Build the plugin
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix dist

      - name: Cache the Falcon server
        id: falcon
        uses: actions/cache@v4
        with:
          path: falcon-bin
          key: falcon-${{ matrix.name }}-${{ env.FALCON_REVISION }}

      - name: Check out the pinned Falcon revision
        if: steps.falcon.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: Falcon-MC/Falcon
          ref: ${{ env.FALCON_REVISION }}
          path: falcon-source
          persist-credentials: false

      - name: Build the Falcon server
        if: steps.falcon.outputs.cache-hit != 'true'
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
          fi
          cmake -S falcon-source -B falcon-build -G Ninja -DCMAKE_BUILD_TYPE=Release "${args[@]}"
          cmake --build falcon-build --target FalconServer --parallel 4
          mkdir -p falcon-bin
          cp falcon-build/Falcon.Server/FalconServer falcon-bin/

      - name: Smoke test in Falcon
        run: |
          scripts/smoke-test.sh "$PWD/falcon-bin/FalconServer" dist/pmmp-compat
          bash tests/integration/FormsPlayerPermissions/run.sh "$PWD/falcon-bin/FalconServer" dist/pmmp-compat

      - uses: actions/upload-artifact@v4
        with:
          name: pmmp-compat-${{ matrix.name }}
          path: dist/pmmp-compat

  windows:
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PHP
        shell: pwsh
        run: scripts/fetch-php-windows.ps1

      - name: Build the plugin
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
          cmake --install build --config Release --prefix dist

      - name: Cache the Falcon server
        id: falcon
        uses: actions/cache/restore@v4
        with:
          path: falcon-bin
          key: falcon-windows-x64-${{ env.FALCON_REVISION }}

      - name: Check out the pinned Falcon revision
        if: steps.falcon.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: Falcon-MC/Falcon
          ref: ${{ env.FALCON_REVISION }}
          path: falcon-source
          persist-credentials: false

      - name: Install MSYS2
        if: steps.falcon.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false

      - name: Build the Falcon server
        if: steps.falcon.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash falcon-source/.github/msys2/install.sh .msys2-packages
          cmake -S falcon-source -B falcon-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build falcon-build --target FalconServer --parallel 4
          mkdir -p falcon-bin
          cp falcon-build/Falcon.Server/FalconServer.exe falcon-bin/

      - name: Save the Falcon server build
        if: steps.falcon.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: falcon-bin
          key: ${{ steps.falcon.outputs.cache-primary-key }}

      - name: Smoke test in Falcon
        shell: bash
        run: |
          cp dist/pmmp-compat/php8ts.dll falcon-bin/
          scripts/smoke-test.sh "$PWD/falcon-bin/FalconServer.exe" dist/pmmp-compat
          bash tests/integration/FormsPlayerPermissions/run.sh "$PWD/falcon-bin/FalconServer.exe" dist/pmmp-compat

      - uses: actions/upload-artifact@v4
        with:
          name: pmmp-compat-windows-x64
          path: dist/pmmp-compat
